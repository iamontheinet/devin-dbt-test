version: 2

models:
  - name: int_interactions_unioned
    description: Tickets and emails stacked into one interaction grain, deduplicated.
    columns:
      - name: interaction_id
        data_tests:
          - unique
          - not_null

  - name: int_interactions_enriched
    description: Interactions enriched with Cortex AI_SENTIMENT and AI_CLASSIFY (incremental).
    columns:
      - name: interaction_id
        data_tests:
          - unique
          - not_null
